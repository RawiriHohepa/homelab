apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-dashboard
  namespace: longhorn
  annotations:
    gethomepage.dev/href: https://longhorn.local.hohepa.dev
spec:
  routes:
    - match: Host(`longhorn.local.hohepa.dev`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
