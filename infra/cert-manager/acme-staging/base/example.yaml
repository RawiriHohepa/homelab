---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-staging
  namespace: default
  labels:
    app.kubernetes.io/name: nginx-staging
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-staging
    spec:
      containers:
      - name: nginx-staging
        image: nginx:latest
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-staging
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: nginx-staging
  ports:
  - name: http
    targetPort: 80
    port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx-staging
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-external
    gethomepage.dev/enabled: "false"
    gethomepage.dev/group: Sample
    gethomepage.dev/name: Nginx Staging
    gethomepage.dev/description: Sample nginx deployment using Staging cert
    gethomepage.dev/icon: nginx.png
    gethomepage.dev/app: nginx
spec:
  entryPoints:
    - websecure
  tls:
    secretName: local-hohepa-dev-staging-tls
