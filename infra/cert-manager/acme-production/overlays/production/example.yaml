---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx
  namespace: default
  annotations:
    gethomepage.dev/href: https://nginx.local.hohepa.dev
spec:
  routes:
    - match: Host(`nginx.local.hohepa.dev`)
      kind: Rule
      services:
        - name: nginx
          port: 80
