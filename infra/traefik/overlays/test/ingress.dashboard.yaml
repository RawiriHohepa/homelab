apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    gethomepage.dev/href: https://traefik.test.local.hohepa.dev
spec:
  routes:
    - match: Host(`traefik.test.local.hohepa.dev`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
