---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
  - secretKey: client_id
    remoteRef:
      key: tailscale-client-id
  - secretKey: client_secret
    remoteRef:
      key: tailscale-client-secret
