---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx-staging
  namespace: default
  annotations:
    gethomepage.dev/href: https://nginx-staging.test.local.hohepa.dev
spec:
  routes:
    - match: Host(`nginx-staging.test.local.hohepa.dev`)
      kind: Rule
      services:
        - name: nginx-staging
          port: 80
